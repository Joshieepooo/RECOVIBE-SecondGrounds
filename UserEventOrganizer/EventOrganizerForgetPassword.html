<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Organizer Forgot Password | RecoVibe - PUP Biñan Campus</title>
    <meta name="description" content="Request a password recovery link or verification code for your RecoVibe event organizer account." />
    <link rel="canonical" href="https://yourdomain.com/UserEventOrganizer/EventOrganizerForgetPassword.html" />
    <link rel="stylesheet" href="EventOrganizerForgotPassword.css" />
  </head>
  <body>
    <div class="screen">
      <div class="side">
        <img class="mark" src="../UserStudent/Picture/PUPLogo-removebg-preview.png" alt="Polytechnic University of the Philippines Bi&#241;an Campus Seal - RecoVibe" width="80" height="80" decoding="async" loading="lazy" />
        <div>
          <h1>RecoVibe Event Organizer Portal</h1>
          <p class="tagline">University, Organization, and Seminar Events.</p>
        </div>
      </div>
      <main class="main">
        <section class="card flow-card">
          <a href="EventOrganizerLogin.html" class="back-link"
            >‹ Back to sign in</a
          >
          <h2>Reset your password</h2>
          <p class="sub">
            Enter the email on your organizer account and we'll send a 6-digit
            verification code.
          </p>
          <div class="field">
            <label for="school-email">Email</label
            ><input
              type="email"
              id="school-email"
              placeholder="Enter your email address"
              autocomplete="email"
              inputmode="email"
              autocapitalize="none"
              spellcheck="false"
              maxlength="254"
              required
            />
          </div>
          <button type="button" class="btn-primary" id="send-code">
            Send code
          </button>
        </section>
      </main>
    </div>
    <script>
      document.getElementById("send-code").onclick = () =>
        (location.href = "EventOrganizerVerifyCode.html");
    </script>
  </body>
</html>
