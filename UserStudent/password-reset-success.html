<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Password Reset Successful | RecoVibe Student Portal</title>
    <meta name="description" content="Your student account password has been updated successfully. Log in to access the RecoVibe Student Portal." />
    <link rel="canonical" href="https://yourdomain.com/UserStudent/password-reset-success.html" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="ForgetPassword.css" />
  </head>
  <body>
    <div class="screen">
      <div class="side">
        <img class="mark" src="Picture/PUPLogo-removebg-preview.png" alt="Polytechnic University of the Philippines Bi&#241;an Campus Seal - RecoVibe" width="80" height="80" decoding="async" loading="lazy" />
        <div>
          <h1>RecoVibe Student Portal</h1>
          <p class="tagline">University, Organization, and Seminar Events.</p>
        </div>
      </div>
      <main class="main">
        <section
          class="card flow-card success-card"
          aria-labelledby="success-heading"
        >
          <div class="success-icon" aria-hidden="true">&#10003;</div>
          <h2 id="success-heading">Password successfully changed</h2>
          <p class="sub">
            Your password has been updated successfully. You can now sign in
            using your new password.
          </p>
          <a
            href="StudentLogin.html"
            class="btn-primary"
            style="display: block; text-decoration: none"
            >Back to Login</a
          >
        </section>
      </main>
    </div>
  </body>
</html>
