<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Reset Super Admin Password | RecoVibe - PUP Biñan Campus</title>
    <meta name="description" content="Establish a new secure password for super administrator access on the RecoVibe platform." />
    <link rel="canonical" href="https://yourdomain.com/UserSuperAdmin/SuperAdminResetPassword.html" />
    <link rel="stylesheet" href="SuperAdminForgotPassword.css" />
  </head>
  <body>
    <div class="screen">
      <div class="side">
        <img class="mark" src="../UserStudent/Picture/PUPLogo-removebg-preview.png" alt="Polytechnic University of the Philippines Bi&#241;an Campus Seal - RecoVibe" width="80" height="80" decoding="async" loading="lazy" />
        <div>
          <h1>RecoVibe Super Admin Portal</h1>
          <p class="tagline">University, Organization, and Seminar Events.</p>
        </div>
      </div>
      <main class="main">
        <section class="card flow-card">
          <h2>Reset your password</h2>
          <p class="sub">
            Create a new password for your RecoVibe Super Admin Portal account.
          </p>
          <div class="field password-field">
            <label for="new-password">New password</label
            ><input type="password" id="new-password" /><button
              type="button"
              class="pass-toggle"
              data-password-target="new-password"
              aria-label="Show password"
            >
              &#128065;
            </button>
          </div>
          <div class="field password-field">
            <label for="confirm-password">Confirm new password</label
            ><input type="password" id="confirm-password" /><button
              type="button"
              class="pass-toggle"
              data-password-target="confirm-password"
              aria-label="Show password"
            >
              &#128065;
            </button>
          </div>
          <p id="match-message" class="match-message"></p>
          <p class="requirements-title">Password must contain:</p>
          <ul class="requirements">
            <li data-requirement="length">At least 8 characters</li>
            <li data-requirement="uppercase">At least one uppercase letter</li>
            <li data-requirement="number">At least one number</li>
          </ul>
          <button type="button" class="btn-primary" id="reset-password">
            Reset Password
          </button>
        </section>
      </main>
    </div>
    <script src="SuperAdminForgotPassword.js"></script>
  </body>
</html>
